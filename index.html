<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Excel Reader</title>
  <link rel="stylesheet" href="styles.css" />
  <script>
    // Apply saved theme before first paint to avoid a flash of the wrong mode.
    (function () {
      var saved = localStorage.getItem('theme')
      var theme = saved || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
      document.documentElement.setAttribute('data-theme', theme)
    })()
  </script>
</head>
<body>
  <div id="titlebar">
    <span id="app-title">Excel Reader</span>
    <div id="titlebar-right">
      <input id="search-input" type="search" placeholder="Search..." spellcheck="false" />
      <span id="search-count"></span>
      <button id="theme-toggle" title="Toggle dark mode" aria-label="Toggle dark mode"></button>
      <button id="open-btn">Open File</button>
    </div>
  </div>

  <div id="sheet-tabs" class="hidden"></div>

  <div id="content">
    <div id="drop-zone">
      <div id="drop-icon">⊞</div>
      <p>Open or drop an Excel file to get started</p>
      <button id="open-btn-center">Open File</button>
      <div id="recent-files" class="hidden"></div>
    </div>
    <div id="table-container" class="hidden"></div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
